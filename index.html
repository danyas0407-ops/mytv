<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Телеканал</title>
    <!-- Подключаем библиотеку для поддержки m3u8 (HLS) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #141414; color: #ffffff; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
        header h1 { font-size: 24px; color: #e50914; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 250px; background-color: #181818; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Стили для кнопок меню (включая выбор с пульта) */
        .category-btn { background: none; color: #aaa; border: none; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 5px; transition: 0.3s; outline: none; }
        .category-btn:hover, .category-btn:focus, .category-btn.active { background-color: #333; color: #fff; font-weight: bold; border-left: 4px solid #e50914; }
        
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        
        /* Плеер (относительное позиционирование для логотипа) */
        #player-container { width: 100%; max-width: 800px; margin-bottom: 20px; display: none; position: relative; }
        video { width: 100%; border-radius: 10px; background-color: #000; outline: none; display: block; }
        video:focus { outline: 3px solid #e50914; } /* Выделение плеера пультом */
        
        /* Стили для логотипа телеканала */
        #channel-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 70px;
            height: auto;
            border-radius: 6px;
            opacity: 0.85;
            pointer-events: none; /* Чтобы пульт и мышка не цеплялись за логотип */
            z-index: 10;
        }
        
        h2 { margin-bottom: 15px; font-size: 22px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        /* Стили для карточек фильмов (включая выбор с пульта) */
        .movie-card { background-color: #222; padding: 15px; border-radius: 8px; cursor: pointer; transition: transform 0.2s, background-color 0.2s; text-align: center; outline: none; }
        .movie-card:hover, .movie-card:focus { transform: scale(1.05); background-color: #e50914; border: 2px solid #fff; }
        
        .movie-title { font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Мой Телеканал</h1>
    </header>

    <div class="container">
        <!-- Меню -->
        <div class="sidebar" id="sidebar"></div>

        <!-- Контент -->
        <div class="main-content">
            <div id="player-container">
                <video id="video-player" controls autoplay></video>
                <!-- Наш логотип -->
                <img id="channel-logo" src="image.png" alt="Логотип канала">
                <h3 id="current-video-title" style="margin-top: 10px; color: #ccc;"></h3>
            </div>

            <h2 id="category-title">Выберите категорию</h2>
            <div class="movie-grid" id="movie-grid"></div>
        </div>
    </div>
