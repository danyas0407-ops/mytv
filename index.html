<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Телеканал</title>
    
    <!-- Библиотека плеера -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* --- 1. СТАРТОВЫЙ ЭКРАН (для включения звука) --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        #start-screen h1 { color: #e50914; margin-bottom: 30px; font-size: 32px; text-transform: uppercase; text-align: center; }
        #start-btn { padding: 15px 30px; font-size: 20px; font-weight: bold; background-color: #e50914; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        #start-btn:active { transform: scale(0.95); }

        /* --- 2. МЕНЮ --- */
        .sidebar { width: 300px; background-color: #111; display: flex; flex-direction: column; border-right: 2px solid #222; z-index: 50; }
        .sidebar h2 { padding: 20px; color: #e50914; text-transform: uppercase; border-bottom: 2px solid #222; text-align: center; }
        .channel-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .channel-btn { background-color: #222; color: #aaa; border: none; text-align: left; padding: 15px; font-size: 16px; cursor: pointer; border-radius: 8px; outline: none; }
        .channel-btn.active, .channel-btn:focus { background-color: #333; color: #fff; font-weight: bold; border-left: 4px solid #e50914; }

        /* --- 3. ТЕЛЕВИЗОР (Этот блок разворачивается на весь экран) --- */
        .tv-container { flex: 1; position: relative; background-color: #000; display: flex; justify-content: center; align-items: center; }
        
        video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; outline: none; z-index: 10; }
        
        .channel-logo { position: absolute; top: 20px; right: 20px; width: 70px; opacity: 0.8; z-index: 20; pointer-events: none; }
        
        .now-playing { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 5px; font-size: 16px; color: #fff; border-left: 4px solid #e50914; z-index: 20; opacity: 0; transition: opacity 0.5s; pointer-events: none; }

        /* Кнопка на весь экран */
        .fs-btn { position: absolute; bottom: 20px; right: 20px; z-index: 30; background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #555; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; text-transform: uppercase; }
        .fs-btn:hover { border-color: #fff; background-color: #e50914; }

        /* --- АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 800px) {
            body { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 35%; border-right: none; border-top: 2px solid #222; }
            .sidebar h2 { display: none; }
            .tv-container { height: 65%; width: 100%; }
            .channel-logo { width: 50px; top: 10px; right: 10px; }
            .fs-btn { bottom: 10px; right: 10px; font-size: 12px; padding: 8px 10px; }
            .now-playing { bottom: 10px; left: 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div id="start-screen">
        <h1>Мой Телеканал</h1>
        <button id="start-btn">Включить телевизор</button>
    </div>

    <!-- Боковое меню -->
    <div class="sidebar">
        <h2>Каналы</h2>
        <div class="channel-list" id="channel-list"></div>
    </div>

    <!-- ТЕЛЕВИЗОР -->
    <div class="tv-container" id="tv-container">
        <!-- Логотип -->
        <img src="image.png" class="channel-logo" alt="Логотип">
        
        <!-- Инфо о фильме -->
        <div class="now-playing" id="now-playing">В эфире: ...</div>
        
        <!-- Плеер -->
        <video id="player" playsinline preload="auto"></video>
        
        <!-- Кнопка फुलскрина -->
        <button class="fs-btn" id="fs-btn">[ ] На весь экран</button>
    </div>

            "comedy": {
                name: "Комедии",
                items: [
                    { title: "Гитлер капут", src: "https://cdnr.interkh.com/03_05_19/03/05/16/bbtPAWK0/1080_uJcKFb3s.mp4/index-v1.m3u8?fckz2=79126d64e46cea4&ha=56953056a28acd3&hi=af59024fdf55f0e&ht=76c4b9e2e9dbd35&hu=d4d5c952ee99439&hui=18432c943847690&t=1792151109&rt=33f6f5298bc62204c3c810101504a89829b91f6446d341018f9fab2227889f9e&hc=5950b6c9af1b9b5&6dfc9dce&x-cdn=10551403" }
                ]
            }
        };

        const player = document.getElementById('player');
        const channelList = document.getElementById('channel-list');
        const nowPlaying = document.getElementById('now-playing');
        const tvContainer = document.getElementById('tv-container'); // Наш контейнер для полного экрана
        const fsBtn = document.getElementById('fs-btn');
        let currentChannelKey = 'american';
        let hlsInstance = null;
        let titleTimeout = null;

        // Создаем кнопки каналов
        for (const key in tvData) {
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            btn.id = 'btn-' + key;
            btn.innerText = tvData[key].name;
            btn.onclick = () => switchChannel(key);
            
            // Чтобы пультом можно было нажать ОК
            btn.onkeydown = (e) => { if (e.key === 'Enter') switchChannel(key); };
            channelList.appendChild(btn);
        }

        // Стартовый экран: Одно нажатие, чтобы разблокировать звук навсегда
        document.getElementById('start-btn').addEventListener('click', function(e) {
            e.preventDefault();
            player.muted = false;
            
            // Просим браузер разблокировать медиа
            const playPromise = player.play();
            if (playPromise !== undefined) {
                playPromise.then(() => player.pause()).catch(() => {});
            }

            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500);

            // Включаем первый канал
            switchChannel('american');
        });

        // Функция переключения канала
        function switchChannel(key) {
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + key).classList.add('active');
            
            currentChannelKey = key;
            restoreTimeAndPlay(key);
        }

        // Простая и надежная функция загрузки видео
        function playVideo(channelKey, index, startTime) {
            const channel = tvData[channelKey];
            const movie = channel.items[index];
            
            // Показываем плашку
            nowPlaying.innerText = "В эфире: " + movie.title;
            nowPlaying.style.opacity = 1;
            if (titleTimeout) clearTimeout(titleTimeout);
            titleTimeout = setTimeout(() => { nowPlaying.style.opacity = 0; }, 5000);

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            const needsHLS = Hls.isSupported() && (movie.src.includes('.m3u8') || movie.src.includes('cdnr.interkh.com'));

            if (needsHLS) {
                hlsInstance = new Hls({ enableWorker: true });
                hlsInstance.loadSource(movie.src);
                hlsInstance.attachMedia(player);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.currentTime = startTime;
                    player.play();
                });
            } else {
                player.src = movie.src;
                player.addEventListener('loadedmetadata', function onLoaded() {
                    player.currentTime = startTime;
                    player.play();
                    player.removeEventListener('loadedmetadata', onLoaded);
                });
            }
        }

        // Надежное сохранение времени (просто запоминаем, где остановились)
        function getSavedState(channelKey) {
            const savedStr = localStorage.getItem('tv_' + channelKey);
            if (savedStr) {
                try { return JSON.parse(savedStr); } catch(e) {}
            }
            return { index: 0, time: 0, ts: Date.now() };
        }

        setInterval(() => {
            if (!player.paused && player.currentTime > 0) {
                localStorage.setItem('tv_' + currentChannelKey, JSON.stringify({
                    index: getSavedState(currentChannelKey).index,
                    time: player.currentTime,
                    ts: Date.now()
                }));
            }
        }, 1000);

        // Восстановление времени после отсутствия
        function restoreTimeAndPlay(channelKey) {
            const state = getSavedState(channelKey);
            const channel = tvData[channelKey];
            
            // Считаем сколько нас не было в секундах
            let secondsAway = (Date.now() - state.ts) / 1000;
            let targetIndex = state.index;
            let targetTime = state.time + secondsAway;

            // Чтобы математика не сломалась, если нас не было больше 2 часов - просто включаем след. фильм
            if (secondsAway > 7200) { 
                targetIndex = (targetIndex + 1) % channel.items.length;
                targetTime = 0;
            }

            playVideo(channelKey, targetIndex, targetTime);
        }

        // Автопереключение серий (Без вылета из полного экрана!)
        player.addEventListener('ended', function() {
            const channel = tvData[currentChannelKey];
            let nextIndex = getSavedState(currentChannelKey).index + 1;
            
            if (nextIndex >= channel.items.length) {
                nextIndex = 0;
            }
            
            // Сбрасываем время для нового фильма
            localStorage.setItem('tv_' + currentChannelKey, JSON.stringify({ index: nextIndex, time: 0, ts: Date.now() }));
            
            // Включаем (так как контейнер в полном экране, он не закроется)
            playVideo(currentChannelKey, nextIndex, 0);
        });

        // --- БЕСШОВНЫЙ ПОЛНЫЙ ЭКРАН ---
        // Разворачиваем именно tvContainer, а не плеер!
        function toggleFullscreen() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            
            if (!isFullscreen) {
                if (tvContainer.requestFullscreen) { tvContainer.requestFullscreen(); }
                else if (tvContainer.webkitRequestFullscreen) { tvContainer.webkitRequestFullscreen(); }
                fsBtn.innerText = "[X] Свернуть";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                fsBtn.innerText = "[ ] На весь экран";
            }
        }

        fsBtn.addEventListener('click', toggleFullscreen);

        // Если вышли через Esc - меняем текст кнопки обратно
        document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) fsBtn.innerText = "[ ] На весь экран"; });
        document.addEventListener('webkitfullscreenchange', () => { if (!document.webkitFullscreenElement) fsBtn.innerText = "[ ] На весь экран"; });

    </script>
