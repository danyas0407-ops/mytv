<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Телеканал - Прямой эфир</title>
    
    <!-- Подключаем библиотеку HLS.js для потокового видео -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* =========================================
           1. БАЗОВЫЕ НАСТРОЙКИ И ПЕРЕМЕННЫЕ
           ========================================= */
        :root {
            --bg-color: #050505;
            --sidebar-bg: #111111;
            --sidebar-border: #222222;
            --primary-color: #e50914;
            --primary-hover: #ff0f1a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
        }

        /* =========================================
           2. СТАРТОВЫЙ ЭКРАН (АДАПТАЦИЯ ДЛЯ iOS)
           ========================================= */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #1a0000 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #start-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .start-logo {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }

        .start-btn {
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            background-color: var(--primary-color);
            color: var(--text-main);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(229, 9, 20, 0.3);
        }

        @media (hover: hover) {
            .start-btn:hover {
                background-color: var(--primary-hover);
                transform: translateY(-2px);
            }
        }

        /* =========================================
           3. БОКОВОЕ МЕНЮ (КАНАЛЫ)
           ========================================= */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--sidebar-border);
            z-index: 20;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }

        .sidebar-header {
            padding: 25px 20px;
            background-color: #0a0a0a;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .sidebar-header h2 {
            color: var(--primary-color);
            font-size: 22px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Стилизация скроллбара */
        .channel-list::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list::-webkit-scrollbar-track {
            background: var(--sidebar-bg);
        }
        .channel-list::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        .channel-btn {
            background-color: #1a1a1a;
            color: var(--text-muted);
            border: 2px solid transparent;
            text-align: left;
            padding: 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            transition: all var(--transition-speed);
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .channel-btn:hover, 
        .channel-btn:focus {
            background-color: #2a2a2a;
            color: var(--text-main);
        }

        .channel-btn.active {
            background-color: #222;
            color: var(--text-main);
            font-weight: bold;
            border-color: var(--primary-color);
            box-shadow: inset 4px 0 0 var(--primary-color);
        }

        /* =========================================
           4. ЭКРАН ТЕЛЕВИЗОРА И ПЛЕЕР
           ========================================= */
        .tv-screen-container {
            flex: 1;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Отключаем клики по видео */
            outline: none;
            z-index: 5;
        }

        /* Логотип телеканала */
        .channel-logo {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 90px;
            height: auto;
            opacity: 0.7;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.8));
        }

        /* Информационная плашка "В эфире" */
        .now-playing {
            position: absolute;
            bottom: 40px;
            left: 40px;
            background: rgba(10, 10, 10, 0.85);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 20px;
            color: var(--text-main);
            border-left: 5px solid var(--primary-color);
            pointer-events: none;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.5s ease;
            z-index: 15;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .now-playing.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* =========================================
           5. СПЕЦЭФФЕКТЫ (ПОМЕХИ И ЗАГРУЗКА)
           ========================================= */
        .tv-static {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://raw.githubusercontent.com/IceCreamYou/html5-canvas-static/master/static.gif');
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.2s;
            mix-blend-mode: screen;
        }

        .tv-static.active {
            opacity: 0.15;
        }

        .loader {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 12;
            display: none;
        }

        .loader.active {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* =========================================
           6. АДАПТАЦИЯ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ
           ========================================= */
        @media (max-width: 850px) {
            body {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 35%; /* Меню занимает 35% экрана снизу */
                border-right: none;
                border-top: 1px solid var(--sidebar-border);
            }
            .sidebar-header {
                padding: 15px;
            }
            .sidebar-header h2 {
                font-size: 18px;
            }
            .channel-btn {
                padding: 15px;
                font-size: 14px;
            }
            .tv-screen-container {
                height: 65%;
                width: 100%;
            }
            .channel-logo {
                width: 60px;
                top: 20px;
                right: 20px;
            }
            .now-playing {
                font-size: 14px;
                bottom: 20px;
                left: 20px;
                padding: 10px 15px;
                border-left-width: 3px;
            }
            .start-btn {
                padding: 15px 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН (Критически важен для iOS Safari) -->
    <div id="start-screen">
        <div class="start-logo">Мой Телеканал</div>
        <button id="start-btn" class="start-btn">Включить телевизор</button>
    </div>

    <!-- БОКОВОЕ МЕНЮ КАНАЛОВ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Каналы</h2>
        </div>
        <div class="channel-list" id="channel-list">
            <!-- Кнопки генерируются динамически через JS -->
        </div>
    </aside>

    <!-- ОСНОВНОЙ ЭКРАН ТЕЛЕВИЗОРА -->
    <main class="tv-screen-container">
        <!-- Эффект белого шума при переключении -->
        <div id="tv-static" class="tv-static"></div>
        
        <!-- Крутилка загрузки -->
        <div id="loader" class="loader"></div>
        
        <!-- Логотип телеканала -->
        <img src="image.png" class="channel-logo" alt="Логотип">
        
        <!-- Плеер прямого эфира -->
        <video id="tv-player" playsinline></video>
        
        <!-- Информационная плашка -->
        <div id="now-playing" class="now-playing">В эфире: Ожидание...</div>
    </main>

        /**
         * =========================================
         *  ЧАСТЬ 2: ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
         * =========================================
         */
        const videoPlayer = document.getElementById('tv-player');
        const channelList = document.getElementById('channel-list');
        const nowPlaying = document.getElementById('now-playing');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const tvStatic = document.getElementById('tv-static');
        const loader = document.getElementById('loader');

        let currentChannelKey = 'american'; // Канал по умолчанию
        let hlsInstance = null; // Глобальный инстанс плеера
        let hideTitleTimeout = null; // Таймер для скрытия плашки
        let stateSaverInterval = null; // Интервал сохранения времени

        /**
         * =========================================
         *  ЧАСТЬ 3: ИНИЦИАЛИЗАЦИЯ И РАЗБЛОКИРОВКА
         * =========================================
         */
        
        // Создаем кнопки интерфейса (Они генерируются ДО нажатия)
        function initInterface() {
            channelList.innerHTML = '';
            for (const key in channelsData) {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.id = 'btn-' + key;
                btn.innerText = channelsData[key].name;
                btn.setAttribute('tabindex', '0'); // Для пульта
                
                // Переключение канала мышью
                btn.onclick = () => activateChannel(key);
                
                // Переключение канала пультом (ОК)
                btn.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activateChannel(key);
                    }
                };
                
                channelList.appendChild(btn);
            }
        }

        /**
         * ИСПРАВЛЕНИЕ ДЛЯ iOS (BugFix из видео)
         * Нам нужно вызвать метод play() напрямую из события click.
         */
        startBtn.addEventListener('click', function(e) {
            e.preventDefault();
            console.log("Запрос на включение телевизора получен");

            // 1. Принудительно разблокируем аудио-контекст браузера
            videoPlayer.muted = false;
            
            const playPromise = videoPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Все отлично, браузер разрешил играть
                    videoPlayer.pause();
                }).catch(error => {
                    // Браузер ругается на пустой SRC, но блокировка уже снята!
                    console.log("Плеер разблокирован для iOS", error);
                });
            }

            // 2. Красиво убираем стартовый экран
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 500);

            // 3. Запускаем первый канал (Напрямую, без эмуляции клика!)
            const firstChannel = Object.keys(channelsData)[0];
            activateChannel(firstChannel);
        });

        /**
         * =========================================
         *  ЧАСТЬ 4: ЛОГИКА ТЕЛЕКАНАЛА
         * =========================================
         */

        // Функция анимации помех (белый шум) при переключении
        function triggerStaticEffect() {
            tvStatic.classList.add('active');
            loader.classList.add('active');
            setTimeout(() => {
                tvStatic.classList.remove('active');
            }, 600); // Помехи длятся 0.6 секунд
        }

        // Показ информационной плашки "В эфире"
        function displayCurrentShow(title) {
            nowPlaying.innerText = "В эфире: " + title;
            nowPlaying.classList.add('show');
            
            // Сбрасываем старый таймер, если он был
            if (hideTitleTimeout) clearTimeout(hideTitleTimeout);
            
            // Прячем плашку через 5 секунд
            hideTitleTimeout = setTimeout(() => {
                nowPlaying.classList.remove('show');
            }, 5000);
        }

        // Основная функция переключения канала
        function activateChannel(key) {
            console.log("Переключаем на канал:", key);
            triggerStaticEffect();

            // Обновляем визуальное состояние кнопок меню
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + key);
            if (activeBtn) activeBtn.classList.add('active');

            currentChannelKey = key;
            
            // Высчитываем, что сейчас должно идти в эфире, и запускаем
            restoreChannelPlayback(key);
        }

        // Настройка и запуск видео-движка (HLS или Native)
        function loadVideoEngine(channelKey, movieIndex, startTime = 0) {
            const channelInfo = channelsData[channelKey];
            const movieInfo = channelInfo.items[movieIndex];
            
            displayCurrentShow(movieInfo.title);

            // Уничтожаем старый поток, чтобы не было утечек памяти
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // Проверяем, нужна ли библиотека HLS
            const needsHls = Hls.isSupported() && (movieInfo.src.includes('.m3u8') || movieInfo.src.includes('cdnr.interkh.com'));

            if (needsHls) {
                // Продвинутая настройка HLS (защита от ошибок)
                hlsInstance = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    enableWorker: true
                });

                hlsInstance.loadSource(movieInfo.src);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    loader.classList.remove('active');
                    videoPlayer.currentTime = startTime; // Проматываем на нужное время
                    videoPlayer.play().catch(e => console.log("HLS Play error", e));
                });

                // Обработчик обрывов связи
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Пропал интернет, пробуем восстановить...");
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Ошибка видео, восстанавливаем...");
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                break;
                        }
                    }
                });

            } else {
                // Если телефон Apple (iOS поддерживает m3u8 напрямую) или это MP4
                videoPlayer.src = movieInfo.src;
                videoPlayer.load();
                
                videoPlayer.addEventListener('loadedmetadata', function onLoaded() {
                    loader.classList.remove('active');
                    videoPlayer.currentTime = startTime;
                    videoPlayer.play().catch(e => console.log("Native Play error", e));
                    // Удаляем лисенер, чтобы он не срабатывал дважды
                    videoPlayer.removeEventListener('loadedmetadata', onLoaded);
                });
            }
        }

        /**
         * =========================================
         *  ЧАСТЬ 5: СИМУЛЯЦИЯ ПРЯМОГО ЭФИРА (ВРЕМЯ)
         * =========================================
         */

        // Получить текущий индекс фильма из памяти
        function getSavedIndex(channelKey) {
            const savedStr = localStorage.getItem('tv_data_' + channelKey);
            if (savedStr) {
                try {
                    return JSON.parse(savedStr).index || 0;
                } catch(e) { return 0; }
            }
            return 0;
        }

        // Сохранение состояния в память каждую секунду
        function startStateSaver() {
            if (stateSaverInterval) clearInterval(stateSaverInterval);
            
            stateSaverInterval = setInterval(() => {
                if (!videoPlayer.paused && videoPlayer.currentTime > 0) {
                    const currentState = {
                        index: getSavedIndex(currentChannelKey),
                        time: videoPlayer.currentTime,
                        timestamp: Date.now() // Запоминаем реальное время, когда мы смотрели
                    };
                    localStorage.setItem('tv_data_' + currentChannelKey, JSON.stringify(currentState));
                }
            }, 1000); // Сохраняем каждую секунду для высокой точности
        }

        // Восстановление эфира после долгого отсутствия
        function restoreChannelPlayback(channelKey) {
            const savedStr = localStorage.getItem('tv_data_' + channelKey);
            const channel = channelsData[channelKey];
            
            if (savedStr) {
                try {
                    const state = JSON.parse(savedStr);
                    // Высчитываем, сколько реальных секунд прошло с момента закрытия приложения
                    const secondsAway = (Date.now() - state.timestamp) / 1000; 
                    
                    let newTime = state.time + secondsAway;
                    let newIndex = state.index;

                    // Защита: Если нас не было очень долго (больше 2 часов), 
                    // просто переключаем на следующий фильм в цикле.
                    if (newTime > 7200) { 
                        newIndex = (newIndex + 1) % channel.items.length;
                        newTime = 0;
                        // Сбрасываем таймер в памяти
                        localStorage.setItem('tv_data_' + channelKey, JSON.stringify({ index: newIndex, time: 0, timestamp: Date.now() }));
                    }

                    loadVideoEngine(channelKey, newIndex, newTime);
                } catch(e) {
                    // Если память сломалась, включаем с нуля
                    loadVideoEngine(channelKey, 0, 0);
                }
            } else {
                // Если зритель включил этот канал в самый первый раз в жизни
                loadVideoEngine(channelKey, 0, 0);
            }
        }

        // Что делать, когда фильм закончился?
        // БЕСКОНЕЧНАЯ КАРУСЕЛЬ ЭФИРА
        videoPlayer.addEventListener('ended', function() {
            console.log("Фильм закончился, включаем следующий...");
            const channel = channelsData[currentChannelKey];
            let nextIndex = getSavedIndex(currentChannelKey) + 1;
            
            // Если список закончился — начинаем с первого фильма (Бесконечный цикл)
            if (nextIndex >= channel.items.length) { 
                nextIndex = 0; 
            }
            
            // Записываем новые данные в память
            const newState = { index: nextIndex, time: 0, timestamp: Date.now() };
            localStorage.setItem('tv_data_' + currentChannelKey, JSON.stringify(newState));
            
            triggerStaticEffect();
            loadVideoEngine(currentChannelKey, nextIndex, 0);
        });

        // Защита от остановки при сворачивании приложения
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible') {
                // Когда пользователь возвращается, принудительно запускаем видео,
                // так как мобильные браузеры ставят его на паузу
                videoPlayer.play().catch(e => console.log("Resume play blocked", e));
            }
        });

        /**
         * =========================================
         *  ЧАСТЬ 6: ЗАПУСК ПРИЛОЖЕНИЯ
         * =========================================
         */
        window.addEventListener('DOMContentLoaded', () => {
            console.log("Инициализация интерфейса Телеканала...");
            initInterface();
            startStateSaver();
        });

    </script>
