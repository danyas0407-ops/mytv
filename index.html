<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Телеканал - Прямой эфир</title>
    <!-- Подключаем библиотеку для HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Боковое меню с каналами */
        .sidebar { 
            width: 300px; 
            background-color: #111; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-right: 2px solid #222;
            z-index: 20;
        }
        .sidebar h1 { color: #e50914; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; text-align: center; }
        
        .channel-btn { 
            background-color: #222; 
            color: #aaa; 
            border: 2px solid transparent; 
            text-align: left; 
            padding: 20px; 
            font-size: 18px; 
            cursor: pointer; 
            border-radius: 8px; 
            transition: 0.2s; 
            outline: none; 
        }
        /* Выделение канала с пульта или при клике */
        .channel-btn:hover, .channel-btn:focus, .channel-btn.active { 
            background-color: #333; 
            color: #fff; 
            font-weight: bold; 
            border-color: #e50914; 
            transform: scale(1.05);
        }

        /* Экран телевизора */
        .tv-screen-container { 
            flex: 1; 
            position: relative; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* Плеер: убираем клики (чтобы нельзя было поставить на паузу), делаем на весь экран */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            pointer-events: none; /* Запрещаем кликать на плеер */
            outline: none;
        }
