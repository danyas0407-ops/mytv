<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart TV OS - Прямой эфир</title>
    
    <!-- Подключаем библиотеку HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        :root {
            --color-bg-base: #000000;
            --color-bg-sidebar: #0a0a0a;
            --color-bg-panel: #141414;
            --color-brand-primary: #e50914;
            --color-brand-hover: #ff0f1a;
            --color-text-main: #ffffff;
            --color-text-muted: #888888;
            --color-border-dark: #222222;
            --font-family-base: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--color-bg-base);
            color: var(--color-text-main);
            font-family: var(--font-family-base);
            overflow: hidden;
            position: fixed;
        }

        /* Экран запуска для разблокировки звука */
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #start-screen.hidden { opacity: 0; visibility: hidden; }

        .boot-logo {
            font-size: 48px; color: var(--color-brand-primary); margin-bottom: 40px;
            text-transform: uppercase; font-weight: 900;
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.6);
        }

        .btn-boot {
            padding: 20px 50px; font-size: 24px; font-weight: bold;
            background-color: var(--color-brand-primary); color: var(--color-text-main);
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.4); text-transform: uppercase;
        }

        .app-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* Боковое меню */
        .sidebar {
            width: 350px; background-color: var(--color-bg-sidebar);
            display: flex; flex-direction: column; border-right: 1px solid var(--color-border-dark);
            z-index: 50; box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }

        .sidebar-header {
            padding: 30px 20px; background-color: var(--color-bg-base);
            border-bottom: 2px solid var(--color-border-dark);
            display: flex; justify-content: space-between; align-items: center;
        }

        .sidebar-header h2 { color: var(--color-brand-primary); font-size: 24px; }
        .clock-display { color: var(--color-text-muted); font-size: 18px; font-family: monospace; }

        .channel-list-container {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }
        .channel-list-container::-webkit-scrollbar { width: 8px; }
        .channel-list-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .channel-btn {
            background-color: var(--color-bg-panel); color: var(--color-text-muted);
            border: 3px solid transparent; text-align: left; padding: 20px; font-size: 18px;
            cursor: pointer; border-radius: 12px; outline: none;
            display: flex; flex-direction: column; gap: 8px; transition: 0.2s;
        }
        .channel-name { font-weight: bold; font-size: 20px; color: inherit; }
        .channel-number { font-size: 14px; background: #222; padding: 3px 8px; border-radius: 4px; display: inline-block; }
        
        .channel-btn.active {
            background-color: #1a1a1a; color: var(--color-text-main);
            border-left: 5px solid var(--color-brand-primary);
        }

        /* Телепрограмма EPG */
        .epg-container {
            height: 30%; background-color: #0f0f0f; border-top: 2px solid var(--color-border-dark);
            padding: 20px; display: flex; flex-direction: column; gap: 10px;
        }
        .epg-title { color: var(--color-brand-primary); font-size: 14px; text-transform: uppercase; }
        .epg-item.now { border-left: 3px solid var(--color-brand-primary); padding-left: 10px; }
        .epg-item.next { border-left: 3px solid #444; padding-left: 10px; opacity: 0.6; margin-top: 10px; }
        .epg-time { color: var(--color-text-muted); font-size: 12px; }
        .epg-movie { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;}

        /* Контейнер телевизора (именно он разворачивается на весь экран) */
        .tv-screen {
            flex: 1; position: relative; background-color: #000;
            display: flex; justify-content: center; align-items: center;
        }

        /* Видео */
        video {
            width: 100%; height: 100%; object-fit: contain;
            pointer-events: none; outline: none; z-index: 10;
        }

        /* Невидимый слой поверх видео для двойного клика (полноэкранного режима) */
        .click-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; cursor: pointer;
        }

        .crt-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 20; pointer-events: none;
        }

        .channel-logo-img {
            position: absolute; top: 40px; right: 40px; width: 100px; opacity: 0.65;
            z-index: 30; pointer-events: none;
        }

        /* Плашка канала OSD */
        .osd-container {
            position: absolute; top: 40px; left: 40px; z-index: 40; pointer-events: none;
            opacity: 0; transition: opacity 0.4s;
        }
        .osd-container.visible { opacity: 1; }
        .osd-channel-info {
            background: rgba(0, 0, 0, 0.85); padding: 20px 30px; border-radius: 12px;
            border-left: 6px solid var(--color-brand-primary);
        }
        .osd-ch-number { font-size: 24px; font-weight: 900; color: var(--color-brand-primary); }
        .osd-ch-name { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .osd-ch-movie { font-size: 18px; color: var(--color-text-muted); }

        /* Кнопка Полного экрана */
        .fullscreen-btn {
            position: absolute; bottom: 40px; right: 40px; z-index: 50;
            background: rgba(0,0,0,0.7); border: 2px solid #444; border-radius: 8px;
            color: #fff; padding: 15px 20px; font-size: 16px; cursor: pointer;
            transition: 0.2s; text-transform: uppercase; font-weight: bold;
        }
        .fullscreen-btn:hover { background: var(--color-brand-primary); border-color: #fff; }

        .static-noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://raw.githubusercontent.com/IceCreamYou/html5-canvas-static/master/static.gif');
            opacity: 0; z-index: 25; pointer-events: none; transition: opacity 0.1s;
        }
        .static-noise.active { opacity: 0.4; }

        @media (max-width: 900px) {
            .app-container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 35%; border-top: 2px solid var(--color-border-dark); }
            .tv-screen { height: 65%; width: 100%; }
            .channel-logo-img { width: 60px; top: 15px; right: 15px; }
            .osd-container { top: 15px; left: 15px; }
            .fullscreen-btn { bottom: 15px; right: 15px; padding: 10px 15px; font-size: 14px; }
            .epg-container { display: none; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="boot-logo">Smart TV OS</div>
        <button id="start-btn" class="btn-boot">Включить телевизор</button>
    </div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>КАНАЛЫ</h2>
                <div class="clock-display" id="nav-clock">00:00</div>
            </div>
            
            <div class="channel-list-container" id="channel-list"></div>

            <div class="epg-container">
                <div class="epg-title">Телепрограмма</div>
                <div class="epg-item now">
                    <span class="epg-time" id="epg-now-time">--:--</span>
                    <span class="epg-movie" id="epg-now-title">Загрузка...</span>
                </div>
                <div class="epg-item next">
                    <span class="epg-time" id="epg-next-time">--:--</span>
                    <span class="epg-movie" id="epg-next-title">Далее...</span>
                </div>
            </div>
        </aside>

        <!-- Контейнер, который мы будем разворачивать на весь экран -->
        <main class="tv-screen" id="tv-screen">
            <div class="crt-overlay"></div>
            <div class="static-noise" id="tv-static"></div>
            
            <!-- Логотип -->
            <img src="image.png" class="channel-logo-img" alt="Channel Logo">
            
            <!-- OSD Плашка -->
            <div class="osd-container" id="osd-container">
                <div class="osd-channel-info">
                    <div class="osd-ch-number" id="osd-number">CH 01</div>
                    <div class="osd-ch-name" id="osd-name">Канал</div>
                    <div class="osd-ch-movie" id="osd-movie">Фильм</div>
                </div>
            </div>

            <!-- Плеер -->
            <video id="tv-player" playsinline preload="auto"></video>
            
            <!-- Слой для отслеживания двойного клика -->
            <div class="click-layer" id="click-layer"></div>

            <!-- Кнопка на весь экран -->
            <button class="fullscreen-btn" id="fullscreen-btn">[ ] Во весь экран</button>
        </main>
    </div>

            "ch_comedy": {
                id: "02", name: "Комедии",
                items: [
                    { title: "Гитлер капут", duration_mock: 5940, src: "https://cdnr.interkh.com/03_05_19/03/05/16/bbtPAWK0/1080_uJcKFb3s.mp4/index-v1.m3u8?fckz2=79126d64e46cea4&ha=56953056a28acd3&hi=af59024fdf55f0e&ht=76c4b9e2e9dbd35&hu=d4d5c952ee99439&hui=18432c943847690&t=1792151109&rt=33f6f5298bc62204c3c810101504a89829b91f6446d341018f9fab2227889f9e&hc=5950b6c9af1b9b5&6dfc9dce&x-cdn=10551403" }
                ]
            }
        };

        const dom = {
            player: document.getElementById('tv-player'),
            channelList: document.getElementById('channel-list'),
            startScreen: document.getElementById('start-screen'),
            startBtn: document.getElementById('start-btn'),
            tvStatic: document.getElementById('tv-static'),
            osdContainer: document.getElementById('osd-container'),
            osdNumber: document.getElementById('osd-number'),
            osdName: document.getElementById('osd-name'),
            osdMovie: document.getElementById('osd-movie'),
            epgNowTime: document.getElementById('epg-now-time'),
            epgNowTitle: document.getElementById('epg-now-title'),
            epgNextTime: document.getElementById('epg-next-time'),
            epgNextTitle: document.getElementById('epg-next-title'),
            tvScreen: document.getElementById('tv-screen'), // Сам контейнер для полного экрана
            fullscreenBtn: document.getElementById('fullscreen-btn'),
            clickLayer: document.getElementById('click-layer')
        };

        let currentChannelKey = 'ch_american';
        let hlsInstance = null;
        let osdTimeout = null;
        let stateSaverInterval = null;

        function buildChannelMenu() {
            dom.channelList.innerHTML = '';
            for (const key in tvDatabase) {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.id = 'btn-' + key;
                btn.innerHTML = `<span class="channel-number">CH ${tvDatabase[key].id}</span><span class="channel-name">${tvDatabase[key].name}</span>`;
                
                btn.addEventListener('click', () => switchChannel(key));
                dom.channelList.appendChild(btn);
            }
        }

        dom.startBtn.addEventListener('click', function(e) {
            e.preventDefault();
            dom.player.muted = false;
            
            const playPromise = dom.player.play();
            if (playPromise !== undefined) playPromise.then(() => dom.player.pause()).catch(e => {});

            dom.startScreen.style.opacity = '0';
            setTimeout(() => dom.startScreen.classList.add('hidden'), 500);

            switchChannel(Object.keys(tvDatabase)[0]);
            
            setInterval(() => {
                const now = new Date();
                document.getElementById('nav-clock').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            }, 1000);
        });

        // МОМЕНТАЛЬНОЕ переключение - убираем долгую задержку статики
        function triggerInstantStatic() {
            dom.tvStatic.classList.add('active');
            setTimeout(() => dom.tvStatic.classList.remove('active'), 150); // Легкий 0.15с блик вместо долгой загрузки
        }

        function showOSD(channelName, movieTitle, channelId) {
            dom.osdNumber.innerText = `CH ${channelId}`;
            dom.osdName.innerText = channelName;
            dom.osdMovie.innerText = movieTitle;
            dom.osdContainer.classList.add('visible');
            
            if (osdTimeout) clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => dom.osdContainer.classList.remove('visible'), 5000);
        }

        function switchChannel(key) {
            triggerInstantStatic();
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + key);
            if (activeBtn) activeBtn.classList.add('active');

            currentChannelKey = key;
            
            // Восстанавливаем сохраненное время и МОМЕНТАЛЬНО запускаем
            restoreBroadcastState(key);
        }

        function bootVideoEngine(channelKey, movieIndex, startTime = 0) {
            const channelObj = tvDatabase[channelKey];
            const movieObj = channelObj.items[movieIndex];
            
            showOSD(channelObj.name, movieObj.title, channelObj.id);
            updateEPG(channelObj, movieIndex);

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            const src = movieObj.src;
            const isHLS = src.includes('.m3u8') || src.includes('cdnr.interkh.com');

            if (Hls.isSupported() && isHLS) {
                hlsInstance = new Hls({ maxBufferLength: 30, enableWorker: true });
                hlsInstance.loadSource(src);
                hlsInstance.attachMedia(dom.player);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    dom.player.currentTime = startTime;
                    dom.player.play();
                });
                hlsInstance.on(Hls.Events.ERROR, function(e, data) {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
                        else hlsInstance.destroy();
                    }
                });
            } else {
                dom.player.src = src;
                dom.player.addEventListener('loadedmetadata', function onMetaLoaded() {
                    dom.player.currentTime = startTime;
                    dom.player.play();
                    dom.player.removeEventListener('loadedmetadata', onMetaLoaded);
                });
            }
        }

        function runStateSaver() {
            if (stateSaverInterval) clearInterval(stateSaverInterval);
            stateSaverInterval = setInterval(() => {
                if (!dom.player.paused && dom.player.currentTime > 0) {
                    localStorage.setItem(`tvos_state_${currentChannelKey}`, JSON.stringify({
                        index: getSavedIndex(currentChannelKey), time: dom.player.currentTime, timestamp: Date.now()
                    }));
                }
            }, 1000);
        }

        function getSavedIndex(channelKey) {
            const data = localStorage.getItem(`tvos_state_${channelKey}`);
            return data ? (JSON.parse(data).index || 0) : 0;
        }

        function restoreBroadcastState(channelKey) {
            const data = localStorage.getItem(`tvos_state_${channelKey}`);
            const channel = tvDatabase[channelKey];
            
            if (data) {
                try {
                    const state = JSON.parse(data);
                    const secondsOffline = (Date.now() - state.timestamp) / 1000;
                    let targetTime = state.time + secondsOffline;
                    let targetIndex = state.index;
                    let currentMovieDuration = channel.items[targetIndex].duration_mock || 7200;

                    while (targetTime >= currentMovieDuration) {
                        targetTime -= currentMovieDuration;
                        targetIndex = (targetIndex + 1) % channel.items.length;
                        currentMovieDuration = channel.items[targetIndex].duration_mock || 7200;
                    }

                    localStorage.setItem(`tvos_state_${channelKey}`, JSON.stringify({ index: targetIndex, time: targetTime, timestamp: Date.now() }));
                    bootVideoEngine(channelKey, targetIndex, targetTime);
                } catch(e) { bootVideoEngine(channelKey, 0, 0); }
            } else { bootVideoEngine(channelKey, 0, 0); }
        }

        function updateEPG(channelObj, currentIndex) {
            const currentItem = channelObj.items[currentIndex];
            const nextItem = channelObj.items[(currentIndex + 1) % channelObj.items.length];
            const now = new Date();
            const formatTime = (date) => date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');

            dom.epgNowTime.innerText = formatTime(now);
            dom.epgNowTitle.innerText = currentItem.title;

            const remainingSeconds = (currentItem.duration_mock || 7200) - dom.player.currentTime;
            const nextTimeDate = new Date(now.getTime() + remainingSeconds * 1000);
            
            dom.epgNextTime.innerText = formatTime(nextTimeDate);
            dom.epgNextTitle.innerText = nextItem.title;
        }

        // БЕСКОНЕЧНЫЙ ЭФИР: когда видео кончилось - сразу грузим следующее, НЕ закрывая полный экран!
        dom.player.addEventListener('ended', function() {
            const channel = tvDatabase[currentChannelKey];
            let nextIndex = getSavedIndex(currentChannelKey) + 1;
            if (nextIndex >= channel.items.length) { nextIndex = 0; }
            
            localStorage.setItem(`tvos_state_${currentChannelKey}`, JSON.stringify({ index: nextIndex, time: 0, timestamp: Date.now() }));
            
            triggerInstantStatic();
            // Вызов загрузки нового фильма. Так как "Full Screen" включен на контейнере, он не закроется!
            bootVideoEngine(currentChannelKey, nextIndex, 0);
        });

        // ==========================================================
        // ЛОГИКА FULLSCREEN (на весь экран разворачивается КОНТЕЙНЕР)
        // ==========================================================
        
        function toggleFullscreen() {
            // Проверяем, открыт ли сейчас полный экран
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
            
            if (!isFullscreen) {
                // Пытаемся открыть контейнер телевизора во весь экран (для ПК, Android, эмуляторов)
                if (dom.tvScreen.requestFullscreen) { dom.tvScreen.requestFullscreen(); } 
                else if (dom.tvScreen.webkitRequestFullscreen) { dom.tvScreen.webkitRequestFullscreen(); } 
                else if (dom.player.webkitEnterFullscreen) { dom.player.webkitEnterFullscreen(); } // Запасной для старых iOS
                dom.fullscreenBtn.innerText = "[x] Свернуть";
            } else {
                // Закрываем полный экран
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                dom.fullscreenBtn.innerText = "[ ] Во весь экран";
            }
        }

        // Клик по кнопке "Во весь экран"
        dom.fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Двойной клик по самому экрану телевизора также открывает/закрывает полный экран
        dom.clickLayer.addEventListener('dblclick', toggleFullscreen);

        // Отслеживание нажатия Esc или кнопок телефона "Назад", чтобы вернуть текст кнопки
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) dom.fullscreenBtn.innerText = "[ ] Во весь экран";
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) dom.fullscreenBtn.innerText = "[ ] Во весь экран";
        });

        window.addEventListener('DOMContentLoaded', () => {
            buildChannelMenu();
            runStateSaver();
        });

    </script>
