<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё ТВ</title>
    <style>
        body {
            background-color: #111; /* Темный фон */
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .controls {
            padding: 15px;
            background-color: #222;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        button:focus { background-color: #ffaa00; outline: none; /* Выделение кнопки для пульта ТВ */ }
        video {
            width: 100%;
            max-height: 80vh;
            background-color: black;
        }
    </style>
</head>
<body>

    <!-- ВСЕ 5 КНОПОК КАНАЛОВ -->
    <div class="controls">
        <button onclick="changeChannel(1)">Русские фильмы</button>
        <button onclick="changeChannel(2)">Американские фильмы</button>
        <button onclick="changeChannel(3)">Мультики</button>
        <button onclick="changeChannel(4)">Экшн</button>
        <button onclick="changeChannel(5)">Комедии</button>
    </div>

    <!-- Сам телевизор (плеер) -->
    <video id="tv-player" controls autoplay></video>

    <script>
        // СПИСКИ ФИЛЬМОВ (ПЛЕЙЛИСТЫ ДЛЯ КАЖДОГО КАНАЛА)
        
        // 1. Русские фильмы
        const channel1 = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" // Заменишь потом на свои
        ];

        // 2. Американские фильмы (ТВОЯ ССЫЛКА ЗДЕСЬ)
        const channel2 = [
            "https://cdnrv.interkh.com/v.en-x/hlwc2KbwYiakBclcRaBgR/n8n1E2wL3R3ABu8aZ29hLcVt1S/htr26Hr1pFlA4RGLIkKhpS2sVbn9RL/8rBe5Veb2RmE2zvXwX2xcDzVj/cb5ikBpIcrfs2mzsxzvepkx0H8O5zGLQR8E3Shqh4DA/is1hOeAtHRi9Wqzk2sOFAmh1HiE182bXCRz1jRdafmbSRzOtj5hyShz5rFnO9KmwSLrnLckxExSNpz8yyrkzcDoOA9/i4FhI_18Gw4iRCSpFms2KzA3zA==", // Тот самый Гарри Поттер
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" // Второй фильм пойдет следом
        ];

        // 3. Мультики
        const channel3 = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" 
        ];

        // 4. Экшн
        const channel4 = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
        ];

        // 5. Комедии
        const channel5 = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
        ];

        // Внутренняя логика переключения
        let currentPlaylist = channel1; 
        let currentMovieIndex = 0;
        const player = document.getElementById('tv-player');

        // Функция запуска видео
        function playMovie() {
            player.src = currentPlaylist[currentMovieIndex];
            player.play();
        }

        // Функция переключения канала (теперь на 5 каналов)
        function changeChannel(channelNum) {
            if (channelNum === 1) currentPlaylist = channel1;
            if (channelNum === 2) currentPlaylist = channel2;
            if (channelNum === 3) currentPlaylist = channel3;
            if (channelNum === 4) currentPlaylist = channel4;
            if (channelNum === 5) currentPlaylist = channel5;
            
            currentMovieIndex = 0; // Начинаем с первого фильма на канале
            playMovie();
        }

        // Автоматическое включение следующего фильма
        player.onended = function() {
            currentMovieIndex++;
            
            // Если канал кончился, крутим заново
            if (currentMovieIndex >= currentPlaylist.length) {
                currentMovieIndex = 0;
            }
            playMovie();
        };

        // Включаем 1 канал при старте
        changeChannel(1);
    </script>
</body>
</html>
