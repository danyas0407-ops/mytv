<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Телеканал - Прямой эфир</title>
    <!-- Подключаем библиотеку для HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Экран блокировки (для запуска со звуком) */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #start-screen h1 { color: #e50914; margin-bottom: 20px; text-transform: uppercase; text-align: center; }
        #start-btn {
            padding: 15px 30px; font-size: 20px; font-weight: bold; background-color: #e50914; 
            color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        #start-btn:hover { background-color: #ff0f1a; transform: scale(1.05); }

        /* Боковое меню с каналами */
        .sidebar { 
            width: 300px; 
            background-color: #111; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            border-right: 2px solid #222;
            z-index: 20;
            overflow-y: auto;
        }
        .sidebar h2 { color: #e50914; font-size: 20px; text-transform: uppercase; text-align: center; margin-bottom: 10px; }
        
        .channel-btn { 
            background-color: #222; 
            color: #aaa; 
            border: 2px solid transparent; 
            text-align: left; 
            padding: 20px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 8px; 
            transition: 0.2s; 
            outline: none; 
        }
        .channel-btn:hover, .channel-btn:focus, .channel-btn.active { 
            background-color: #333; color: #fff; font-weight: bold; border-color: #e50914; 
        }

        /* Экран телевизора */
        .tv-screen-container { 
            flex: 1; 
            position: relative; 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        video { 
            width: 100%; height: 100%; object-fit: contain; pointer-events: none; outline: none;
        }

        .channel-logo {
            position: absolute; top: 30px; right: 30px; width: 80px; opacity: 0.85; z-index: 10; pointer-events: none;
        }

        .now-playing {
            position: absolute; bottom: 30px; left: 30px; background: rgba(0, 0, 0, 0.7); padding: 10px 20px;
            border-radius: 5px; font-size: 18px; color: #fff; border-left: 4px solid #e50914;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }

        /* Адаптация для мобильных телефонов */
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; } /* Переворачиваем: плеер сверху, меню снизу */
            .sidebar { width: 100%; height: 35%; border-right: none; border-top: 2px solid #222; }
            .tv-screen-container { height: 65%; width: 100%; }
            .channel-logo { width: 50px; top: 15px; right: 15px; } /* Логотип поменьше на телефоне */
            .now-playing { font-size: 14px; bottom: 15px; left: 15px; padding: 5px 10px; }
        }
    </style>
</head>
<body>

    <!-- Стартовый экран для телефонов -->
    <div id="start-screen">
        <h1>Мой Телеканал</h1>
        <button id="start-btn">Включить телевизор</button>
    </div>

    <!-- Меню каналов -->
    <div class="sidebar" id="sidebar">
        <h2>Каналы</h2>
        <!-- Кнопки генерируются скриптом -->
    </div>

    <!-- Экран телевизора -->
    <div class="tv-screen-container">
        <!-- Логотип -->
        <img src="image.png" class="channel-logo" alt="Лого">
        
        <!-- Плеер -->
        <video id="tv-player" playsinline></video>
        
        <div id="now-playing" class="now-playing">В эфире: ...</div>
    </div>

    <script>
